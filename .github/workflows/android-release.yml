name: Android Release Build & CI

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Create local.properties from secrets
        run: |
          echo "TAPSELL_KEY=${{ secrets.TAPSELL_KEY }}" > local.properties
          echo "BAZAAR_PUBLIC_KEY=${{ secrets.BAZAAR_PUBLIC_KEY }}" >> local.properties

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::STORE_PASSWORD missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD missing"; exit 1; }

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Bundle Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: panjganeh-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: panjganeh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f release-keystore.jks
          rm -f local.properties
