# ═══════════════════════════════════════════════════════════════
# Setup Gradle Wrapper
# ═══════════════════════════════════════════════════════════════
# این workflow یه بار دستی اجرا می‌شه تا فایل‌های Gradle Wrapper
# رو بسازه و به ریپازیتوری اضافه کنه.
#
# فایل‌های ساخته‌شده:
#   - gradlew
#   - gradlew.bat
#   - gradle/wrapper/gradle-wrapper.jar
#   - gradle/wrapper/gradle-wrapper.properties
# ═══════════════════════════════════════════════════════════════

name: Setup Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  setup:
    name: Generate & Commit Gradle Wrapper
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Verify Wrapper Files
        run: |
          echo "=== Files in current directory ==="
          ls -la
          echo ""
          echo "=== Files in gradle/wrapper/ ==="
          ls -la gradle/wrapper/ || echo "gradle/wrapper/ does not exist"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Commit and Push Wrapper Files
        run: |
          git add gradlew gradlew.bat gradle/wrapper/ || true
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add gradle wrapper files"
            git push
          fi
