name: Android build and tests

on:
  push:
    branches:
      - redesign/reference-ai-integration
  pull_request:
    branches:
      - redesign/premium-game-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare local-only configuration
        env:
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
        run: |
          printf 'TAPSELL_KEY=%s\nBAZAAR_PUBLIC_KEY=%s\n' \
            "${TAPSELL_KEY:-DEFAULT_TAPSELL_KEY}" \
            "${BAZAAR_PUBLIC_KEY:-DEFAULT_BAZAAR_PUBLIC_KEY}" > local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panjganeh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
